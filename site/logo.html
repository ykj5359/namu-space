<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로고 선택 | 나무의공간</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261001c">
<style>
  .logos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 30px; }
  .lg { background: #fff; border: 2px solid var(--line); border-radius: var(--radius); padding: 20px; cursor: pointer; transition: .2s; }
  .lg:hover { border-color: var(--wood); }
  .lg.on { border-color: var(--ink); box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  .lg .pv { background: var(--bg); border-radius: 10px; padding: 18px; display: grid; gap: 14px; }
  .lg .pv svg { width: 100%; height: auto; max-height: 110px; }
  .lg .pv .dark { background: var(--ink); border-radius: 8px; padding: 12px; }
  .lg .pv .dark svg text { fill: #fff; }
  .lg .pv .dark svg [fill="#2B2B2B"] { fill: #fff; }
  .lg .pv .dark svg [stroke="#2F4A3A"] { stroke: #D9B27F; }
  .lg .pv .dark svg [fill="#2F4A3A"] { fill: #4F7A62; }
  .lg h3 { font-size: 17px; margin: 14px 0 4px; display: flex; align-items: center; gap: 8px; }
  .lg h3 b { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--wood); color: #fff; font-size: 13px; }
  .lg p { font-size: 14px; color: var(--ink-2); margin: 0 0 10px; }
  .lg .dl { display: flex; gap: 8px; }
  .lg .dl button { font-family: var(--font); font-size: 13px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  .lg .dl button:hover { background: var(--bg-2); }
  .current { display: flex; align-items: center; gap: 20px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 22px; margin-top: 24px; flex-wrap: wrap; }
  .current .logo { height: 56px; }
  @media (max-width: 760px) { .logos { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a href="index.html" class="logo" data-logo aria-label="나무의공간"></a>
    <nav class="main"><a href="index.html">홈</a><a href="order.html">도면 주문</a><a href="catalog.html">카탈로그</a></nav>
    <a class="tel-btn" data-tel href="#">📞 <span data-site="tel"></span></a>
    <button class="menu-btn" aria-label="메뉴">☰</button>
  </div>
</header>

<div class="wrap" style="padding:40px 20px 80px">
  <div class="eyebrow">Logo</div>
  <h1 class="sec-title">로고 후보 10종</h1>
  <p class="sec-lead">마음에 드는 로고를 클릭하면 이 브라우저에서 홈페이지 전체 로고가 바뀝니다. 확정하시면 알려 주세요. 기본값으로 고정하고 카탈로그에도 반영해 드립니다.</p>
  <div class="current"><span style="font-size:14px;color:var(--ink-3)">현재 선택</span><a class="logo" data-logo href="#"></a><span id="curName" style="font-weight:700"></span></div>
  <div class="logos" id="grid"></div>
</div>

<footer class="site"><div class="wrap"><a class="logo" data-logo href="index.html"></a><div><b data-site="name"></b> · <span data-site="tel"></span></div></div></footer>

<script src="js/logos.js?v=20260928h"></script>
<script src="js/main.js?v=20261001c"></script>
<script src="js/cart.js?v=20261001c"></script>
<script>
(function () {
  const grid = document.getElementById('grid');
  let adm = false; try { adm = !!sessionStorage.getItem('nw_admin_token'); } catch (e) {}
  if (!adm) { grid.innerHTML = '<div style="grid-column:1/-1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px;text-align:center"><b>관리자 전용 페이지입니다.</b><br><span style="color:var(--ink-2)">관리자 페이지에 로그인한 뒤 이용해 주세요. 홈페이지 로고는 관리자 페이지 → 설정 → 로고에서 바꿉니다.</span><br><a class="btn wood sm" href="admin.html" style="margin-top:14px">관리자 로그인</a></div>'; return; }
  function cur() { try { return +(localStorage.getItem('nw_logo') || SITE.defaultLogo); } catch (e) { return SITE.defaultLogo; } }
  function render() {
    const c = cur();
    grid.innerHTML = NW_LOGOS.map(l => `
      <div class="lg ${l.id === c ? 'on' : ''}" data-id="${l.id}">
        <div class="pv">${l.svg}<div class="dark">${l.svg}</div></div>
        <h3><b>${l.id}</b>${l.name}${l.id === c ? ' <span class="tag">선택됨</span>' : ''}</h3>
        <p>${l.desc}</p>
        <div class="dl"><button data-svg="${l.id}">SVG 저장</button><button data-png="${l.id}">PNG 저장</button></div>
      </div>`).join('');
    document.getElementById('curName').textContent = `${c}번 · ` + (NW_LOGOS.find(x => x.id === c) || {}).name;
    renderLogos();
  }
  grid.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) {
      const l = NW_LOGOS.find(x => x.id === +(b.dataset.svg || b.dataset.png));
      if (b.dataset.svg) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([l.svg], { type: 'image/svg+xml' })); a.download = `나무의공간_로고${l.id}.svg`; a.click(); }
      else {
        const img = new Image(); const url = URL.createObjectURL(new Blob([l.svg], { type: 'image/svg+xml' }));
        img.onload = () => { const c = document.createElement('canvas'); c.width = 2100; c.height = 600; const x = c.getContext('2d'); x.drawImage(img, 0, 0, 2100, 600); const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = `나무의공간_로고${l.id}.png`; a.click(); URL.revokeObjectURL(url); };
        img.src = url;
      }
      e.stopPropagation(); return;
    }
    const card = e.target.closest('.lg'); if (!card) return;
    try { localStorage.setItem('nw_logo', card.dataset.id); } catch (err) {}
    render();
  });
  render();
})();
</script>
</body>
</html>
