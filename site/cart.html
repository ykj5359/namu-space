<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장바구니 | 나무의공간</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Nanum+Myeongjo:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261001w">
</head>
<body>
<header class="site">
  <div class="wrap">
    <a href="index.html" class="logo" data-logo aria-label="나무의공간"></a>
    <nav class="main"><a href="index.html#products">제품</a><a href="index.html#spec">규격·단면</a><a href="index.html#interior">연출 갤러리</a><a href="index.html#site">시공 현장</a><a href="order.html">도면 주문</a><a href="cart.html" class="active">장바구니</a><a href="catalog.html">카탈로그</a><a href="index.html#contact">문의</a></nav>
    <a class="tel-btn" data-tel href="#">📞 <span data-site="tel"></span></a>
    <button class="menu-btn" aria-label="메뉴">☰</button>
  </div>
</header>

<div class="wrap">
  <div style="padding-top:40px">
    <div class="eyebrow">Cart</div>
    <h1 class="sec-title">장바구니</h1>
    <p class="sec-lead">담아 둔 도면을 확인하고 수량을 조정한 뒤 결제로 진행합니다. 도면을 누르면 크게 볼 수 있고, <b>수정</b>을 누르면 도면 주문 페이지에서 치수를 고칠 수 있습니다.</p>
  </div>
  <div class="cart-wrap">
    <div class="cart-list" id="cartList"></div>
    <aside class="sumbox" id="cartSum"></aside>
  </div>
</div>

<footer class="site"><div class="wrap"><a class="logo" data-logo href="index.html"></a><div><b data-site="name"></b> · 대표 <span data-site="ceo"></span> · <span data-site="tel"></span> · <span data-site="email"></span><br><span style="opacity:.7">사업자등록번호 <span data-site="bizno"></span> (<span data-site="bizname"></span>) · <span data-site="address"></span> <a href="admin.html" class="gear" title="관리자" aria-label="관리자">⚙</a></span></div></div></footer>
<div class="floating"><a data-tel href="#">전화</a><a class="dark" href="order.html">주문</a></div>
<div class="lb"><button class="x">×</button><img alt=""></div>

<script src="js/logos.js?v=20261001x"></script>
<script src="js/main.js?v=20261001y"></script>
<script src="js/cart.js?v=20261001w"></script>
<script>
(function () {
  const list = document.getElementById('cartList'), sum = document.getElementById('cartSum'), ADMIN = new URLSearchParams(location.search).get('admin') === '1';
  function render() {
    const items = NW_CART.items(), t = NW_CART.totals(items), won = NW_CART.won;
    if (!items.length) {
      list.innerHTML = `<div class="note">담긴 도면이 없습니다. <a href="order.html" style="color:var(--wood-dark);font-weight:700">도면으로 주문하기 →</a></div>`;
      sum.innerHTML = `<div class="row"><span>도면</span><b>0건</b></div><a class="btn wood" href="order.html">도면 만들러 가기</a>`; return;
    }
    list.innerHTML = items.map((it, i) => { const p = NW_CART.price(it); const c = it.calc; return `
      <div class="ci" data-id="${it.id}">
        <img src="${it.thumb}" data-full="${it.sheet}" alt="도면 ${i + 1}">
        <div>
          <h4>도면 ${i + 1} · ${it.dir === 'v' ? '세로 배열' : '가로 배열'} ${it.A} × ${it.B}</h4>
          <div class="meta">각재 길이 C ${c.C} · 끝 여백 D ${c.D} · F/E/G ${it.F}/${c.Ereal}/${c.Gadj}<br>
            면 구성 ${({ none: '1면', left: '2면 좌측', right: '2면 우측', both: '3면 ㄷ자', column: '4면 기둥' })[it.corner] || it.corner}${it.corner !== 'none' ? ' (K=' + it.K + ')' : ''} · ${it.finishText || it.finish} · ${it.install}<br>
            각재 ${c.totalBattens}개 (원본 3600 ${NW_CART.sticks(c.totalBattens, c.C).sticks}본) · 합판 원장 ${c.sheets}장 · 면적 ${c.area} ㎡</div>
          <div class="acts"><a href="order.html?item=${it.id}">수정</a><button type="button" data-act="dup">복제</button><button type="button" data-act="del">삭제</button></div>
        </div>
        <div class="right">
          <span class="qty"><button type="button" data-act="minus">−</button><input type="number" min="1" max="999" value="${it.qty}" data-act="qty"><button type="button" data-act="plus">+</button></span>
          <small>${won(p.unit)} / 장</small><b>${won(p.sub)}</b>${ADMIN ? `<small style="color:#b45309">원가 ${won(NW_CART.cost(it).unit)}/장 (각재 30×30-3600 ${NW_CART.cost(it).sticks}본 · 합판 ${it.calc.sheets}장 · 인건비 ${won(NW_CART.cost(it).labor)}) · 마진 ${won(p.unit - NW_CART.cost(it).unit)}</small>` : ''}
        </div>
      </div>`; }).join('');
    sum.innerHTML = `<div class="row"><span>도면 ${items.length}건 · 총 ${t.count}장</span></div>
      <div class="row"><span>공급가</span><b>${won(t.supply)}</b></div><div class="row"><span>부가세 10%</span><b>${won(t.vat)}</b></div>
      <div class="row tot"><span>예상 합계</span><b>${won(t.total)}</b></div>${ADMIN ? `<div class="row" style="color:#b45309"><span>원가 합계(참고)</span><b>${won(items.reduce((s2, it) => s2 + NW_CART.cost(it).sub, 0))}</b></div>` : ''}
      <p class="note">예상 금액입니다. 실제 견적은 접수 후 확인해 드리며, 시공 여부·현장 조건에 따라 달라질 수 있습니다.</p>
      <a class="btn wood" href="checkout.html">결제하기</a><a class="btn ghost" href="order.html">도면 더 담기</a>
      <button type="button" class="btn ghost" id="cartClear" style="border-color:var(--line);color:var(--ink-3)">전체 비우기</button>`;
    document.getElementById('cartClear').addEventListener('click', () => { if (confirm('장바구니를 모두 비울까요?')) NW_CART.clear(); });
    // 라이트박스
    const lb = document.querySelector('.lb'), lbi = lb.querySelector('img');
    list.querySelectorAll('.ci img').forEach(im => im.addEventListener('click', () => { lbi.src = im.dataset.full; lb.classList.add('open'); }));
  }
  list.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return; const id = e.target.closest('.ci').dataset.id, it = NW_CART.find(id); if (!it) return;
    if (b.dataset.act === 'del') { if (confirm('이 도면을 삭제할까요?')) NW_CART.remove(id); }
    else if (b.dataset.act === 'dup') { const c = JSON.parse(JSON.stringify(it)); delete c.id; NW_CART.add(c); }
    else if (b.dataset.act === 'minus') NW_CART.update(id, { qty: Math.max(1, it.qty - 1) });
    else if (b.dataset.act === 'plus') NW_CART.update(id, { qty: Math.min(999, it.qty + 1) });
  });
  list.addEventListener('change', e => { const i = e.target; if (i.dataset.act !== 'qty') return; NW_CART.update(i.closest('.ci').dataset.id, { qty: Math.min(999, Math.max(1, +i.value || 1)) }); });
  document.addEventListener('cart:change', render);
  document.querySelector('.lb').addEventListener('click', () => document.querySelector('.lb').classList.remove('open'));
  render();
})();
</script>
</body>
</html>
